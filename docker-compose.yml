version: "3.8"

# Local development stack. Production deployment on the shared Ubuntu
# server (129.232.204.218) gets its own compose file / server blocks,
# isolated from twelvewoodenspoons.co.za and torahcanvas.co.za — see
# FINDI_TECHNICAL_DESIGN_AND_IMPLEMENTATION_PLAN.md §6.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: findi
      POSTGRES_PASSWORD: findi
      POSTGRES_DB: findi
    ports:
      - "5432:5432"
    volumes:
      - findi_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: "postgresql://findi:findi@postgres:5432/findi?schema=public"
      REDIS_URL: "redis://redis:6379"
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file:
      - apps/web/.env
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  findi_postgres_data:
